<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eden RP — Chargement</title>
<style>
  :root {
    --ink: #120c14;
    --paper: #f3e2c4;
    --gold: #e7c98a;
    --red: #c4262a;
    --chakra: #4aa3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #140e2a; color: var(--paper);
    font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(8,4,10,.75) 100%); }

  /* couches qui bougent doucement (parallaxe) */
  .drift-slow { animation: drift 60s ease-in-out infinite alternate; }
  .drift-mid  { animation: drift 40s ease-in-out infinite alternate; }
  .drift-fast { animation: drift 26s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-18px); } to { transform: translateX(18px); } }
  .clouds { animation: clouds 90s linear infinite; }
  @keyframes clouds { from { transform: translateX(0); } to { transform: translateX(-960px); } }

  /* logo */
  #logo { position: fixed; left: 50%; top: 4vh; transform: translateX(-50%); width: min(36vh, 34vw, 560px);
      }
  @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
  @keyframes float { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -8px); } }

  /* infos du serveur (haut gauche) */
  #info { position: fixed; top: 28px; left: 34px; font-size: 14px; line-height: 1.7; text-shadow: 0 2px 6px #000; }
  #info .name { font-size: 20px; font-weight: 800; letter-spacing: .5px; color: var(--paper); }
  #info .row { color: var(--gold); opacity: .9; }
  #info .row b { color: var(--paper); font-weight: 700; }

  /* bas de l'écran */
  #bottom { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(760px, 86vw); text-align: center; }
  #tip { min-height: 48px; font-size: 17px; color: var(--paper); text-shadow: 0 2px 8px #000;  }
  #tip .k { display: inline-block; padding: 1px 8px; margin: 0 2px; border: 1px solid var(--gold); border-radius: 4px;
    color: var(--gold); font-weight: 800; font-size: 14px; background: rgba(0,0,0,.35); }
  #tip .lbl { color: var(--red); font-weight: 900; letter-spacing: 2px; margin-right: 8px; }

  .bar { position: relative; height: 16px; margin-top: 18px; background: rgba(10,6,14,.85);
    border: 2px solid rgba(231,201,138,.55); transform: skewX(-18deg); overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .fill { position: absolute; inset: 0; width: 0%; background: linear-gradient(90deg, #1e5fd8, var(--chakra) 60%, #bfe3ff);
    box-shadow: 0 0 18px var(--chakra);  }

  @keyframes flow { from { background-position: 0 0; } to { background-position: 22px 0; } }
  .status { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--gold);
    text-shadow: 0 2px 6px #000; letter-spacing: .4px; }
  .status #file { max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  .kanji { font-family: "Yu Mincho", "MS Mincho", "Noto Serif CJK JP", serif; }

  /* sceaux qui tournent à gauche de la barre */
  #seal { position: fixed; right: 40px; bottom: 34px; width: 74px; height: 74px; opacity: .9; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>

<div id="info">
  <div class="name" id="srv">Eden RP</div>
  <div class="row">Carte : <b id="map">—</b></div>
  <div class="row">Mode : <b id="gm">DarkRP · Naruto RP</b></div>
  <div class="row">Joueurs max : <b id="max">—</b></div>
</div>

<div id="bottom">
  <div id="tip"></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="status"><span id="status">Connexion au village…</span><span id="file"></span></div>
</div>

<svg id="seal" viewBox="-50 -50 100 100">
  <circle r="44" fill="none" stroke="#c4262a" stroke-width="4" stroke-dasharray="210 70"/>
  <circle r="32" fill="none" stroke="#e7c98a" stroke-width="2" stroke-dasharray="4 6"/>
  <text y="10" text-anchor="middle" font-size="30" fill="#f3e2c4" class="kanji" font-weight="900">忍</text>
</svg>

<script>
  // ---------------- astuces affichées pendant le chargement ----------------
  var TIPS = [
    ['Course ninja', 'Appuie deux fois sur <span class="k">Z</span> pour courir comme un vrai shinobi.'],
    ['Jutsus', 'Ouvre le menu du ninja avec <span class="k">F3</span> pour apprendre et équiper tes techniques.'],
    ['Inventaire', 'La touche <span class="k">K</span> permute entre tes deux inventaires d\'attaques.'],
    ['Combat', '<span class="k">T</span> passe du Taijutsu au Kenjutsu. Clic droit maintenu pour parer.'],
    ['Kunai', 'Lance un kunai avec <span class="k">G</span>, change de projectile avec <span class="k">B</span>.'],
    ['Mudras', 'Un coup reçu pendant les mudras interrompt ton jutsu : choisis bien ton moment.'],
    ['Progression', 'Tes capacités (chakra, vitesse, force...) montent toutes seules avec ton niveau.'],
    ['Personnages', 'Tu peux avoir 2 personnages. Change de personnage avec <span class="k">!perso</span>.'],
    ['Eden', 'Sous l\'Arbre d\'Eden, chaque ninja choisit son destin.'],
    ['Double saut', 'Appuie sur <span class="k">Espace</span> en l\'air pour un second saut.'],
    ['Taijutsu', 'Enchaîne 5 coups pour déclencher le Konoha Senpû !'],
    ['Respect', 'Reste dans ton rôle : le RP avant tout. Le staff est là pour t\'aider.']
  ];
  var tipEl = document.getElementById('tip'), tipI = Math.floor(Math.random() * TIPS.length);
  function showTip() {
    var t = TIPS[tipI % TIPS.length]; tipI++;
    tipEl.innerHTML = '<span class="lbl">' + t[0].toUpperCase() + '</span>' + t[1];
  }
  showTip(); setInterval(showTip, 8000);

  // ---------------- fonctions appelées par Garry's Mod ----------------
  var total = 0, needed = 0, fake = 0;
  function setBar(p) { document.getElementById('fill').style.width = Math.max(2, Math.min(100, p)) + '%'; }
  function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    if (servername) document.getElementById('srv').textContent = servername;
    if (mapname) document.getElementById('map').textContent = mapname;
    if (maxplayers) document.getElementById('max').textContent = maxplayers;
  }
  function SetFilesTotal(n) { total = n; update(); }
  function SetFilesNeeded(n) { needed = n; update(); }
  function DownloadingFile(f) {
    document.getElementById('file').textContent = f.replace(/^.*[\\/]/, '');
    if (needed > 0) needed--; update();
  }
  var STATUS = [
    [/workshop/i, 'Téléchargement du contenu Workshop…'],
    [/lua/i, 'Préparation des jutsus…'],
    [/map|world/i, 'Chargement du village…'],
    [/client info/i, 'Envoi de tes informations…'],
    [/starting|lua state/i, 'Réveil du chakra…'],
    [/mounting/i, 'Ouverture des parchemins…']
  ];
  function SetStatusChanged(s) {
    var txt = s;
    for (var i = 0; i < STATUS.length; i++) if (STATUS[i][0].test(s)) { txt = STATUS[i][1]; break; }
    document.getElementById('status').textContent = txt;
    fake = Math.min(fake + 6, 95);
    if (total <= 0) setBar(fake);
  }
  function update() {
    if (total > 0) setBar((total - needed) / total * 100);
    document.getElementById('status').textContent = total > 0
      ? 'Téléchargement : ' + Math.max(0, total - needed) + ' / ' + total + ' fichiers'
      : document.getElementById('status').textContent;
  }
  // aperçu dans un navigateur : la barre avance toute seule
  if (!/GMod/i.test(navigator.userAgent)) {
    var demo = 0; setInterval(function () { demo = (demo + 1.2) % 100; setBar(demo); }, 120);
  }

</script>
