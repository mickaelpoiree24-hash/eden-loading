<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Eden RP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
:root{--sakura:#e07a98;--sumi:#23302a;--sang:#b3262e;--gris:#5f7266;--foret:#2f5a3f;--paper:#d1c0a8}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;color:var(--sumi);font-family:'Zen Kaku Gothic New',sans-serif}
body{background:linear-gradient(180deg,#f6f1df 0,#e9ecd6 40%,#d5e1c9 100%)}
#scene{position:fixed;display:block;z-index:0;pointer-events:none}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 46% 26% at 50% 80%,rgba(247,243,226,.82),transparent 100%)}
#disc,#logo{position:fixed;z-index:2;border-radius:50%}
#disc{background:radial-gradient(circle closest-side,var(--paper) 0,var(--paper) 78%,transparent 100%)}
#logo{z-index:3;border-radius:0;object-fit:cover;-webkit-mask-image:radial-gradient(closest-side,#000 80%,transparent 99%);mask-image:radial-gradient(closest-side,#000 80%,transparent 99%);animation:float 7s ease-in-out infinite}
#stack{position:fixed;z-index:4;left:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:1.1vh}
.sub{font:500 clamp(13px,2.1vh,20px) 'Shippori Mincho',serif;color:var(--sang);letter-spacing:.32em}
.tip{min-height:3.2em;max-width:min(600px,86vw);text-align:center;font-size:clamp(13px,2vh,17px);line-height:1.65;color:#2f3f35;transition:opacity .8s}
.bar{position:relative;width:min(560px,78vw);height:10px}
.bar:before{content:"";position:absolute;inset:3px 0;border-radius:9px;background:rgba(35,48,42,.18)}
.fill{position:absolute;left:0;top:2px;height:6px;border-radius:6px 3px 3px 6px;background:linear-gradient(90deg,#24402e,var(--foret) 45%,#8fb06f 80%,var(--sakura));width:0}
.petal{position:absolute;top:-5px;width:20px;height:20px;margin-left:-10px;left:0}
.ranks{display:flex;gap:min(6vw,60px)}
.rk{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 clamp(11px,1.7vh,14px) 'Shippori Mincho',serif;color:#6f8777;transition:color .6s}
.rk i{width:12px;height:12px;border-radius:50% 0 50% 50%;background:#b9c9b4;transform:rotate(45deg);transition:.6s}
.rk.on{color:var(--sumi)}.rk.on i{background:var(--sakura);box-shadow:0 0 10px rgba(224,122,152,.8)}
.rk.on:last-child i{background:var(--sang)}
.branch{position:fixed;top:0;width:min(52vw,820px);height:auto;z-index:5;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(60,40,40,.25))}
.branch.l{left:0}.branch.r{right:0;transform:scaleX(-1)}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
#status{position:fixed;z-index:7;top:3vh;width:100%;text-align:center;font-size:clamp(11px,1.8vh,14px);color:var(--gris);letter-spacing:.08em}
footer{position:fixed;z-index:7;left:3vw;right:3vw;bottom:2.6vh;display:flex;justify-content:space-between;font-size:clamp(11px,1.8vh,14px);color:#e6eedc;text-shadow:0 1px 3px rgba(0,0,0,.5)}
footer b{color:#fff;font-weight:500}
.discord{position:fixed;z-index:8;left:50%;bottom:2.2vh;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 22px;border-radius:999px;background:linear-gradient(90deg,#24402e,#2f5a3f);color:#fdf3ef;border:1.5px solid #e07a98;font:500 clamp(12px,1.9vh,15px) 'Zen Kaku Gothic New',sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:background .2s,transform .2s}
.discord:hover{background:linear-gradient(90deg,#2f5a3f,#e07a98);transform:translateX(-50%) translateY(-2px)}
.discord svg{width:1.3em;height:1.3em;fill:#f6b4c6}
.snd{display:flex;align-items:center;gap:10px}
.snd button{background:none;border:0;padding:0;cursor:pointer;display:flex}
.snd svg{width:22px;height:22px;fill:#fff}
#vol{-webkit-appearance:none;appearance:none;width:96px;height:4px;border-radius:4px;background:rgba(255,255,255,.4);outline:none;cursor:pointer}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#e07a98;border:2px solid #fff}
#vol::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#e07a98;border:2px solid #fff}
#clock{margin-left:6px;font-variant-numeric:tabular-nums}
.mist{animation:drift 26s ease-in-out infinite alternate}.mist.b{animation-duration:34s;animation-direction:alternate-reverse}
.fall{stroke-dasharray:9 7;animation:fall 1.1s linear infinite}
@keyframes drift{to{transform:translateX(90px)}}
@keyframes fall{to{stroke-dashoffset:-16}}
@keyframes float{50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const tips=["Quand les cerisiers d’Eden fleurissent, le village retient son souffle.",
"Chaque shinobi commence à l’Académie. Seuls les plus patients deviennent Kage.",
"Tout le jardin naît du cercle d’Eden : ses montagnes, ses cascades, ses forêts.",
"Le soleil rouge se lève sur Eden. Votre histoire commence ici.",
"Jouez votre personnage, protégez le village, et faites fleurir Eden."];
let ti=0;function tip(){const t=$('tip');t.style.opacity=0;setTimeout(()=>{t.textContent=tips[ti++%tips.length];t.style.opacity=1},800)}
tip();setInterval(tip,6000);

// ---------- décor : part du cercle du logo (800,360) et s'étend sur tout l'écran ----------
function pine(x,y,h,c){const w=h*.36;let s=`<rect x="${x-h*.03}" y="${y-h*.15}" width="${h*.06}" height="${h*.15}" fill="#2a2a20"/>`;
 for(let i=0;i<3;i++){const t=y-h+i*h*.27,b=t+h*.5,hw=w*(.55+i*.25);s+=`<polygon points="${x},${t} ${x-hw},${b} ${x+hw},${b}" fill="${c}"/>`}return s}
function pagoda(x,y,w,c){let s='';for(let i=0;i<3;i++){const ww=w*(1-i*.22),yy=y-i*w*.42;s+=`<rect x="${x-ww*.38}" y="${yy-w*.3}" width="${ww*.76}" height="${w*.3}" fill="${c}"/><polygon points="${x-ww*.62},${yy-w*.3} ${x},${yy-w*.55} ${x+ww*.62},${yy-w*.3}" fill="${c}"/>`}return s}
function mist(y,o,cls,dx,n){let s='';for(let i=0;i<n;i++)s+=`<ellipse cx="${dx+i*330}" cy="${y+(i%2)*10}" rx="${150+i%3*45}" ry="${10+i%2*6}" fill="#fff" opacity="${o}"/>`;return `<g class="mist ${cls}">${s}</g>`}
function falls(x,y1,y2){return `<path d="M${x-9} ${y1}h18l8 ${y2-y1}h-34z" fill="#fff" opacity=".85"/><path class="fall" d="M${x-5} ${y1+4}l-3 ${y2-y1-8}M${x} ${y1+2}l1 ${y2-y1-4}M${x+5} ${y1+4}l4 ${y2-y1-8}" stroke="#bcd6dc" stroke-width="3" fill="none"/><ellipse cx="${x}" cy="${y2+2}" rx="42" ry="7" fill="#fff" opacity=".65"/>`}
let sc='<defs><radialGradient id="glow"><stop offset="0" stop-color="#e8a27a" stop-opacity=".45"/><stop offset=".5" stop-color="#f0c9a0" stop-opacity=".18"/><stop offset="1" stop-color="#f0c9a0" stop-opacity="0"/></radialGradient></defs>';
sc+='<circle cx="800" cy="360" r="760" fill="url(#glow)"/><circle cx="800" cy="360" r="300" fill="#c0392b" opacity=".08"/>';
sc+='<path d="M0 900V300L40 250 70 290 110 150 150 270 200 230 260 330 380 380 520 410 700 440 900 440 1080 410 1220 380 1330 250 1370 120 1410 250 1460 200 1500 290 1550 240 1600 280V900Z" fill="#b6c8b8" opacity=".78"/>';
sc+=mist(330,.55,'',-300,7);
sc+='<path d="M0 900V470L60 420 110 450 170 360 230 440 360 470 520 505 700 530 900 530 1080 505 1240 470 1330 390 1390 440 1450 330 1510 420 1600 400V900Z" fill="#8aa593"/>';
sc+=pagoda(1332,392,44,'#5f7d69')+pagoda(1405,446,30,'#5f7d69');
[[90,452],[140,436],[310,478],[440,498],[1180,476],[1260,462],[1530,426]].forEach(([x,y],i)=>sc+=pine(x,y+8,40+i%3*10,'#6f917c'));
sc+=falls(215,436,596)+falls(1385,446,590);
sc+=mist(470,.6,'b',-200,7);
sc+='<path d="M0 900V565C90 555 200 590 330 640L520 735 690 830 760 900Z" fill="#3f5f48"/><path d="M1600 900V560C1510 550 1400 590 1270 640L1080 735 910 830 840 900Z" fill="#4a6c53"/>';
sc+='<path d="M170 582C150 540 195 520 175 470" stroke="#1f2b21" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M178 505C215 498 240 485 262 464" stroke="#1f2b21" stroke-width="6" fill="none" stroke-linecap="round"/>'+
 [[160,462,78,16],[262,450,56,13],[110,502,60,13],[206,424,50,11]].map(([x,y,a,b])=>`<ellipse cx="${x}" cy="${y}" rx="${a}" ry="${b}" fill="#2c4a36"/>`).join('');
[[60,566,110],[300,628,84],[385,675,66]].forEach(([x,y,h])=>sc+=pine(x,y,h,'#2f4d3a'));
[[1540,560,122],[1470,578,92],[1300,632,78],[1220,672,62]].forEach(([x,y,h])=>sc+=pine(x,y,h,'#2f4d3a'));
sc+=mist(690,.5,'',-350,7);
sc+='<path d="M0 900V862Q400 846 800 866T1600 856V900Z" fill="#2c4435"/>';
sc+=pine(40,888,130,'#233a2d')+pine(120,890,92,'#2a4434')+pine(1560,888,136,'#233a2d')+pine(1480,890,96,'#2a4434');
$('scene').innerHTML=sc;$('scene').setAttribute('viewBox','0 0 1600 900');$('scene').setAttribute('preserveAspectRatio','none');

// ---------- mise en page : le logo est le centre de tout ----------
function layout(){
  const W=innerWidth,H=innerHeight,cy=H*.40,L=Math.min(H*.66,660,W*.95),s=Math.max(W/1600,H/900);
  Object.assign($('scene').style,{width:1600*s+'px',height:900*s+'px',left:W/2-800*s+'px',top:cy-360*s+'px'});
  for(const id of ['logo','disc'])Object.assign($(id).style,{width:L+'px',height:L+'px',left:W/2-L/2+'px',top:cy-L/2+'px'});
  $('stack').style.top=(cy+L*.37)+'px';
}
layout();addEventListener('resize',()=>{layout();rs()});

// ---------- branches de cerisier fournies ----------
let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const bp=[['M-20 30C120 60 220 20 340 90S520 110 640 200',12],['M200 45C230 120 220 200 270 280',8],['M340 90C380 40 460 30 540 0',7],['M470 108C500 170 480 250 520 330',7],['M90 50C110 110 90 170 130 230',7],['M270 280C300 320 290 360 320 400',5],['M600 175C660 140 710 150 760 110',6],['M150 38C170 0 200-10 240-20',5]];
const cols=['#fbd5df','#f6b4c6','#fff2f4','#ee93ae','#f9c3d2'];
function flower(x,y,s,c){let g='';for(let i=0;i<5;i++)g+=`<ellipse cx="0" cy="${-s*.52}" rx="${s*.4}" ry="${s*.56}" transform="rotate(${i*72})" fill="${c}" stroke="rgba(190,80,115,.35)" stroke-width="1"/>`;
 let st='';for(let i=0;i<7;i++){const a=i*51*Math.PI/180;st+=`<line x1="0" y1="0" x2="${Math.cos(a)*s*.3}" y2="${Math.sin(a)*s*.3}" stroke="#b3262e" stroke-width="1.2"/>`}
 return `<g transform="translate(${x} ${y}) rotate(${R()*360})">${g}${st}<circle r="${s*.1}" fill="#e8c35a"/></g>`}
function bud(x,y,s){return `<ellipse cx="${x}" cy="${y}" rx="${s*.3}" ry="${s*.5}" transform="rotate(${R()*180} ${x} ${y})" fill="#ee93ae" stroke="rgba(190,80,115,.4)"/>`}
function buildBranch(id){const el=$(id);el.innerHTML=bp.map(([d,w])=>`<path d="${d}" fill="none" stroke="#3a2a26" stroke-width="${w}" stroke-linecap="round"/>`).join('');
 const ps=[...el.querySelectorAll('path')];
 el.insertAdjacentHTML('beforeend',ps.map(p=>{const len=p.getTotalLength(),w=+p.getAttribute('stroke-width'),d=p.getAttribute('d'),k=w>8?1.4:1;return [[.5,3],[.25,6]].map(([f,a])=>`<path d="${d}" fill="none" stroke="#3a2a26" stroke-width="${w+a*k}" stroke-linecap="round" stroke-dasharray="${len*f} ${len*3}"/>`).join('')}).join(''));
 let f='';
 ps.forEach((p,pi)=>{const len=p.getTotalLength();for(let t=len*.12;t<len;t+=20){const q=p.getPointAtLength(t),sz=15+R()*17;f+=flower(q.x+(R()-.5)*34,q.y+(R()-.2)*30,sz,cols[R()*5|0]);if(R()<.4)f+=bud(q.x+(R()-.5)*50,q.y+10+R()*26,12)}
  const e=p.getPointAtLength(len);f+=flower(e.x,e.y,26,'#fff2f4')});
 el.insertAdjacentHTML('beforeend',f)}
buildBranch('b1');buildBranch('b2');

// ---------- progression ----------
let shown=0,target=0,total=0;
function setP(p){target=Math.max(target,Math.min(100,p))}
(function loop(){
  shown+=(target-shown)*.06;
  const w=$('fill').parentElement.clientWidth*shown/100;
  $('fill').style.width=w+'px';$('pt').style.left=w+'px';$('pt').style.transform='rotate('+(25+shown*5)+'deg)';
  $('pct').textContent=Math.round(shown)+'%';
  document.querySelectorAll('.rk').forEach((e,i)=>e.classList.toggle('on',shown>=i*25+(i?1:0)));
  requestAnimationFrame(loop);
})();

// API GMod
function GameDetails(name,url,map,max){$('map').textContent=map;$('players').textContent=max}
function SetFilesTotal(n){total=n}
function SetFilesNeeded(n){if(total)setP((total-n)/total*100)}
function SetStatusChanged(s){$('status').textContent=s;if(/sending client info|workshop|lua/i.test(s))setP(95)}
if(!/Garrys|GMod/i.test(navigator.userAgent)){let d=0;const t=setInterval(()=>{d+=Math.random()*2.2;setP(d);if(d>=100)clearInterval(t)},120);$('map').textContent='rp_konoha_eden';$('players').textContent='64'}


// ---------- musique de fond + heure ----------
const bgm=$('bgm');let muted=false;
function setVol(){bgm.volume=muted?0:$('vol').value/100;$('ion').style.display=(muted||+$('vol').value===0)?'none':'';$('ioff').style.display=(muted||+$('vol').value===0)?'':'none'}
$('vol').addEventListener('input',()=>{muted=false;setVol()});
$('mute').addEventListener('click',()=>{muted=!muted;setVol()});
setVol();bgm.play().catch(()=>addEventListener('pointerdown',()=>bgm.play().catch(()=>{}),{once:true}));
function clk(){$('clock').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
clk();setInterval(clk,1000);

// ---------- pétales ----------
const cv=$('c'),x=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();
const pc=['#f9c9d5','#f4a8bc','#fde8ec','#ffffff','#ee94ae'];
const mk=i=>({x:Math.random()*W*1.1-W*.1,y:i?Math.random()*H:-20,s:5+Math.random()*8,v:.6+Math.random()*1.1,r:Math.random()*6.28,w:(Math.random()-.5)*.05,p:Math.random()*6.28,c:pc[Math.random()*5|0],a:.65+Math.random()*.35});
const P=Array.from({length:70},()=>mk(1));
function petal(l){x.save();x.translate(l.x,l.y);x.rotate(l.r);x.scale(1,.35+.65*Math.abs(Math.sin(l.p)));x.globalAlpha=l.a;x.fillStyle=l.c;x.beginPath();x.moveTo(0,l.s);x.bezierCurveTo(-l.s*1.1,l.s*.2,-l.s*.8,-l.s*.9,-l.s*.2,-l.s);x.lineTo(0,-l.s*.75);x.lineTo(l.s*.2,-l.s);x.bezierCurveTo(l.s*.8,-l.s*.9,l.s*1.1,l.s*.2,0,l.s);x.fill();x.restore()}
(function draw(){x.clearRect(0,0,W,H);
 for(const l of P){l.y+=l.v;l.p+=.03;l.x+=Math.sin(l.p*.6)*.9+.7;l.r+=l.w;if(l.y>H+20||l.x>W+30)Object.assign(l,mk(0));petal(l)}
 requestAnimationFrame(draw)})();
</script>
